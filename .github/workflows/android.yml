name: Build Expo Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, design/multicolor-ui, release/v1.2.3]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pause:
    if: github.event_name != 'workflow_dispatch' && !(github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/v1.2.3') && contains(github.event.head_commit.message, '[build apk]'))
    runs-on: ubuntu-latest
    steps:
      - run: echo 'APK build skipped. Run manually or merge with [build apk] to request a build.'
  build:
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/v1.2.3') && contains(github.event.head_commit.message, '[build apk]'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: '1'
      MUSIC_OFFLINE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Install Expo dependencies
        run: npm install --no-audit --no-fund
      - name: Verify library and audio signal processing
        run: npm run check
      - name: Verify Expo dependency compatibility
        run: npx expo install --check
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Restore native compilation cache
        id: native_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          key: native-v2-${{ runner.os }}-${{ hashFiles('package.json', 'modules/**/android/build.gradle', 'modules/**/android/src/main/java/**') }}
          path: |
            node_modules/**/android/.cxx/
            node_modules/**/android/build/intermediates/cxx/
            android/app/.cxx/
            android/app/build/intermediates/cxx/
      - name: Verify generated launcher manifest
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          application = ET.parse('android/app/src/main/AndroidManifest.xml').getroot().find('application')
          android = '{http://schemas.android.com/apk/res/android}'
          for attribute in ('icon', 'roundIcon'):
              assert application.get(android + attribute) == '@mipmap/aiplayed_launcher', attribute
          assert application.get(android + 'label') == '@string/app_name'
          base = ET.parse('android/app/src/main/res/values/styles.xml').getroot()
          qualified = ET.parse('android/app/src/main/res/values-v33/styles.xml').getroot()
          api33 = 'android:windowSplashScreenBehavior'
          assert not any(item.get('name') == api33 for item in base.iter('item'))
          assert any(item.get('name') == api33 for item in qualified.iter('item'))
          print('Generated launcher and API-qualified branded splash resources verified.')
          PY
      - name: Compile music engine before native packaging
        working-directory: android
        run: ./gradlew :local-music:compileReleaseKotlin :local-music:compileReleaseJavaWithJavac -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 --no-daemon
      - name: Build standalone APK
        id: native_build
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 --no-daemon
      - name: Retain candidate APK for validation diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: unverified-candidate-apk
          retention-days: 7
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Run Android Lint
        id: android_lint
        continue-on-error: true
        working-directory: android
        run: ./gradlew :app:lintRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 --no-daemon
      - name: Verify APK signature, launcher and offline permissions
        id: package_checks
        continue-on-error: true
        run: |
          apk_path=$(find android/app/build/outputs/apk/release -name "*.apk" -print -quit)
          test -n "$apk_path"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk_path"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions "$apk_path" > apk-permissions.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk_path" > apk-metadata.txt
          app_name=$(node -p "require('./app.config').expo.name")
          app_version=$(node -p "require('./app.config').expo.version")
          app_version_code=$(node -p "require('./app.config').expo.android.versionCode")
          grep -Fx "application-label:'$app_name'" apk-metadata.txt
          grep -F "versionCode='$app_version_code'" apk-metadata.txt | grep -F "versionName='$app_version'"
          unzip -Z1 "$apk_path" > apk-resources.txt
          launcher_path=$(python - <<'PY'
          import pathlib, re
          metadata = pathlib.Path('apk-metadata.txt').read_text()
          match = re.search(r"^application:.*icon='([^']+)'", metadata, re.MULTILINE)
          assert match, 'APK application icon is missing'
          print(match.group(1))
          PY
          )
          grep -Fx "$launcher_path" apk-resources.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree "$apk_path" --file "$launcher_path" > apk-launcher.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree "$apk_path" --file AndroidManifest.xml > apk-manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump resources "$apk_path" > apk-resource-table.txt
          node scripts/verify-apk-branding.cjs > apk-branding.json
          grep -E '^package:|^application-label:|^application:' apk-metadata.txt
          cat apk-launcher.txt
          sha256sum "$apk_path" > apk-sha256.txt
          if grep -Eq "android.permission.(INTERNET|ACCESS_NETWORK_STATE|RECORD_AUDIO|READ_MEDIA_IMAGES|READ_MEDIA_VIDEO)" apk-permissions.txt; then
            echo "Standalone offline APK requests a forbidden network or media permission" >&2
            exit 1
          fi
      - name: Install emulator fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Android interaction and startup checks
        id: android_ui
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: python scripts/android-ui-checks.py
      - name: Upload Android screenshots and recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-interaction-evidence-v1.2.3
          retention-days: 30
          path: verification/android-v1.2.3/
          if-no-files-found: warn
      - name: Require every release validation to pass
        run: |
          test '${{ steps.android_lint.outcome }}' = success
          test '${{ steps.package_checks.outcome }}' = success
          test '${{ steps.android_ui.outcome }}' = success
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: aiplayedmusic-apk
          retention-days: 30
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          retention-days: 30
          path: |
            android/app/build/reports/
            package-lock.json
            apk-permissions.txt
            apk-metadata.txt
            apk-resources.txt
            apk-manifest.txt
            apk-launcher.txt
            apk-branding.json
            apk-resource-table.txt
            apk-sha256.txt
          if-no-files-found: ignore


      - name: Save native compilation cache
        continue-on-error: true
        if: always() && steps.native_build.outcome == 'success' && steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.native_cache.outputs.cache-primary-key }}
          path: |
            node_modules/**/android/.cxx/
            node_modules/**/android/build/intermediates/cxx/
            android/app/.cxx/
            android/app/build/intermediates/cxx/
      - name: Publish verified v1.2.3 APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path=$(find android/app/build/outputs/apk/release -name "*.apk" -print -quit)
          cp "$apk_path" Aiplayed-v1.2.3.apk
          sha256sum Aiplayed-v1.2.3.apk > Aiplayed-v1.2.3.apk.sha256
          gh release create v1.2.3 Aiplayed-v1.2.3.apk Aiplayed-v1.2.3.apk.sha256 --target "$GITHUB_SHA" --title "Aiplayed v1.2.3" --notes-file verification/RELEASE_NOTES_1.2.3.md
