name: Build Expo Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      MUSIC_OFFLINE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Expo dependencies
        run: npm install --no-audit --no-fund
      - name: Check library selectors and configuration
        run: npm run check
      - name: Verify Expo dependency compatibility
        run: npx expo install --check
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build standalone APK and run Android Lint
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:lintRelease --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: aiplayedmusic-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            android/app/build/reports/
            package-lock.json
          if-no-files-found: ignore
