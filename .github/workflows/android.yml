name: Build Expo Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, design/multicolor-ui]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pause:
    if: github.event_name != 'workflow_dispatch' && !(github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[build apk]'))
    runs-on: ubuntu-latest
    steps:
      - run: echo 'APK build skipped. Run manually or merge with [build apk] to request a build.'
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[build apk]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      MUSIC_OFFLINE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Install Expo dependencies
        run: npm install --no-audit --no-fund
      - name: Verify library and audio signal processing
        run: npm run check
      - name: Verify Expo dependency compatibility
        run: npx expo install --check
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Verify generated launcher manifest
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          application = ET.parse('android/app/src/main/AndroidManifest.xml').getroot().find('application')
          android = '{http://schemas.android.com/apk/res/android}'
          for attribute in ('icon', 'roundIcon'):
              assert application.get(android + attribute) == '@mipmap/aiplayed_launcher', attribute
          assert application.get(android + 'label') == '@string/app_name'
          print('Generated Android manifest uses the Aiplayed launcher and app name.')
          PY
      - name: Compile music engine before native packaging
        working-directory: android
        run: ./gradlew :local-music:compileReleaseKotlin :local-music:compileReleaseJavaWithJavac -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon
      - name: Build standalone APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon
      - name: Run Android Lint
        working-directory: android
        run: ./gradlew :app:lintRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon
      - name: Verify APK signature, launcher and offline permissions
        run: |
          apk_path=$(find android/app/build/outputs/apk/release -name "*.apk" -print -quit)
          test -n "$apk_path"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk_path"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions "$apk_path" > apk-permissions.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk_path" > apk-metadata.txt
          app_name=$(node -p "require('./app.config').expo.name")
          app_version=$(node -p "require('./app.config').expo.version")
          app_version_code=$(node -p "require('./app.config').expo.android.versionCode")
          grep -Fx "application-label:'$app_name'" apk-metadata.txt
          grep -F "versionCode='$app_version_code'" apk-metadata.txt | grep -F "versionName='$app_version'"
          unzip -Z1 "$apk_path" > apk-resources.txt
          launcher_path=$(python - <<'PY'
          import pathlib, re
          metadata = pathlib.Path('apk-metadata.txt').read_text()
          match = re.search(r"^application:.*icon='([^']+)'", metadata, re.MULTILINE)
          assert match, 'APK application icon is missing'
          print(match.group(1))
          PY
          )
          grep -Fx "$launcher_path" apk-resources.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree "$apk_path" --file "$launcher_path" > apk-launcher.txt
          grep -F 'E: adaptive-icon' apk-launcher.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree "$apk_path" --file AndroidManifest.xml > apk-manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump resources "$apk_path" > apk-resource-table.txt
          grep -E '^package:|^application-label:|^application:' apk-metadata.txt
          cat apk-launcher.txt
          sha256sum "$apk_path" > apk-sha256.txt
          if grep -q "android.permission.INTERNET" apk-permissions.txt; then
            echo "Standalone offline APK unexpectedly requests internet access" >&2
            exit 1
          fi
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: aiplayedmusic-apk
          retention-days: 7
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          retention-days: 7
          path: |
            android/app/build/reports/
            package-lock.json
            apk-permissions.txt
            apk-metadata.txt
            apk-resources.txt
            apk-manifest.txt
            apk-launcher.txt
            apk-resource-table.txt
            apk-sha256.txt
          if-no-files-found: ignore


