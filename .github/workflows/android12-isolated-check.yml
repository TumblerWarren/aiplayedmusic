name: Verify failed Android 12 theme first
on:
  push:
    branches: [ci/verify-android12-only-20261022]
permissions:
  contents: read
  actions: write
jobs:
  android12:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b01d3ba3780d73d564e789f6db0c8936babb65f8
      - name: Reuse this revision's compiled APK and pause the full pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/39783516772 --jq .head_sha)" = "$(git rev-parse HEAD)"
          for attempt in $(seq 1 90); do
            artifact=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/39783516772/artifacts --jq '.artifacts[] | select(.name == "unverified-candidate-apk") | .id')
            if [ -n "$artifact" ]; then
              gh api --method POST repos/$GITHUB_REPOSITORY/actions/runs/39783516772/cancel
              exit 0
            fi
            state=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/39783516772 --jq .status)
            test "$state" != completed
            sleep 10
          done
          echo "Candidate APK was not retained within 15 minutes" >&2
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: unverified-candidate-apk
          path: candidate
          run-id: 39783516772
          github-token: ${{ github.token }}
      - name: Verify driver regressions
        run: |
          python scripts/android-ui-geometry.test.py
          python scripts/android-theme-driver.test.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Install verification tools and prepare inspector
        run: |
          python -m pip install Pillow
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python scripts/build-ui-helper.py
          sudo chmod 666 /dev/kvm
      - name: Run complete Android 12 theme suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: python scripts/android-theme-checks.py --apk candidate/app-release.apk
      - name: Retain Android 12 screenshots, startup videos and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-theme-evidence-api31
          path: verification/android-theme-api31/
          retention-days: 30
          if-no-files-found: warn
