name: Preserve timed-out Android 15 evidence for focused retry
on:
  push:
    branches: [ci/verify-android12-only-20261022]
permissions:
  contents: read
  actions: write
jobs:
  preserve-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: theme-evidence-api35
          path: prior-evidence
          run-id: 39791701435
          github-token: ${{ github.token }}
      - name: Preserve first-attempt screenshots, recordings and results
        uses: actions/upload-artifact@v4
        with:
          name: theme-evidence-api35-run39791701435-attempt1
          path: prior-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Clear only the archived artifact name before the focused retry uploads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/12436297376 --jq .name)" = theme-evidence-api35
          gh api --method DELETE repos/$GITHUB_REPOSITORY/actions/artifacts/12436297376
