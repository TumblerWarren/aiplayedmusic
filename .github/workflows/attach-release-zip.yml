name: Attach ZIP to the existing v1.3.1 release
on:
  push:
    branches: [ci/release-zip-assets]
    paths: [.github/workflows/attach-release-zip.yml]
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the existing release APK and checksum
        run: |
          gh release download v1.3.1 --pattern Aiplayed-v1.3.1.apk --pattern Aiplayed-v1.3.1.apk.sha256
          sha256sum --check Aiplayed-v1.3.1.apk.sha256
      - name: Package and verify the unchanged APK
        run: |
          zip -9 Aiplayed-v1.3.1.zip Aiplayed-v1.3.1.apk Aiplayed-v1.3.1.apk.sha256
          unzip -t Aiplayed-v1.3.1.zip
          expected=$(sha256sum Aiplayed-v1.3.1.apk | cut -d ' ' -f 1)
          actual=$(unzip -p Aiplayed-v1.3.1.zip Aiplayed-v1.3.1.apk | sha256sum | cut -d ' ' -f 1)
          test "$actual" = "$expected"
          sha256sum Aiplayed-v1.3.1.zip > Aiplayed-v1.3.1.zip.sha256
      - name: Attach ZIP and checksum without replacing published assets
        run: gh release upload v1.3.1 Aiplayed-v1.3.1.zip Aiplayed-v1.3.1.zip.sha256
