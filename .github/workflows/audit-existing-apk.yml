name: Audit and verify the existing run 71 APK
on:
  push:
    branches: [ci/verify-android12-only-20261022]
permissions:
  contents: read
  actions: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: unverified-candidate-apk
          path: android/app/build/outputs/apk/release
          run-id: 39809400056
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: build-diagnostics
          path: original-diagnostics
          run-id: 39809400056
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Verify APK identity, unchanged app source, original compilation and Lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess, xml.etree.ElementTree as ET
          source = 'f9c7d92ab29b7bb9c007ca89723c30a8949c3283'
          repo = 'TumblerWarren/aiplayedmusic'
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          run = api(f'repos/{repo}/actions/runs/39809400056')
          assert run['head_sha'] == source and run['head_branch'] == 'main'
          allowed = {
              'scripts/android-ui-checks.py', 'scripts/android-ui-geometry.test.py',
              'scripts/android-theme-checks.py', 'scripts/android-theme-driver.test.py',
              'scripts/fixtures/run71-clipped-bass.xml', 'verification/TEST_VALIDITY_AUDIT.md',
              '.github/workflows/audit-existing-apk.yml',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', source, 'HEAD'], text=True).splitlines())
          assert changed <= allowed, 'Runtime/build inputs changed: ' + str(sorted(changed - allowed))
          jobs = api(f'repos/{repo}/actions/runs/39809400056/jobs')['jobs']
          build = next(job for job in jobs if job['name'] == 'build')
          required = {
              'Verify library and audio signal processing', 'Verify Expo dependency compatibility',
              'Compile music engine and patched SystemUI from source', 'Build standalone APK',
          }
          passed = {step['name'] for step in build['steps'] if step['conclusion'] == 'success'}
          assert required <= passed, 'Original compile/regression gates did not pass'
          apk = Path('android/app/build/outputs/apk/release/app-release.apk')
          digests = list(Path('original-diagnostics').rglob('apk-sha256.txt'))
          assert len(digests) == 1, 'Missing original APK checksum'
          with apk.open('rb') as file:
              digest = hashlib.file_digest(file, 'sha256').hexdigest()
          assert digest == digests[0].read_text().split()[0], 'APK differs from original package validation'
          reports = list(Path('original-diagnostics').rglob('lint-results-release.xml'))
          assert reports, 'Missing original Android Lint XML'
          for report in reports:
              root = ET.parse(report).getroot()
              assert root.tag == 'issues'
              errors = [issue.attrib for issue in root.findall('issue') if issue.get('severity', '').lower() in ['error', 'fatal']]
              assert not errors, errors
          print('PASS: unchanged runtime/build inputs; original compilation/regressions; exact APK checksum; Android Lint')
          print('APK SHA256:', digest)
          PY
      - name: Re-run the full original APK package checks without compiling
        env:
          MUSIC_OFFLINE_BUILD: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          source = Path('.github/workflows/android.yml').read_text()
          marker = '      - name: Verify APK signature, launcher and offline permissions\n'
          assert source.count(marker) == 1
          section = source.split(marker, 1)[1].split('        run: |\n', 1)[1]
          lines = []
          for line in section.splitlines():
              if line and not line.startswith('          '):
                  break
              lines.append(line[10:] if line else '')
          assert lines and 'apksigner' in '\n'.join(lines)
          subprocess.run(['bash', '-e', '-o', 'pipefail'], input='\n'.join(lines) + '\n', text=True, check=True)
          PY
      - name: Run the audited driver regressions
        run: |
          python scripts/android-ui-geometry.test.py
          python scripts/android-theme-driver.test.py
          python scripts/media-session.test.py
  sound:
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: unverified-candidate-apk
          path: android/app/build/outputs/apk/release
          run-id: 39809400056
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Prepare emulator verification tools
        run: |
          python -m pip install Pillow
          if ! command -v ffmpeg >/dev/null; then
            if test -f /etc/apt/sources.list.d/ubuntu.sources; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
            fi
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
          python scripts/build-ui-helper.py
          sudo chmod 666 /dev/kvm
      - name: Repeat the formerly failing Sound path three times
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: python scripts/android-ui-checks.py --apk android/app/build/outputs/apk/release/app-release.apk --scenario sound --repeat 3
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-sound-evidence
          path: verification/android-v1.2.6/
          retention-days: 30
          if-no-files-found: warn
  interactions:
    needs: sound
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: unverified-candidate-apk
          path: android/app/build/outputs/apk/release
          run-id: 39809400056
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Prepare emulator verification tools
        run: |
          python -m pip install Pillow
          if ! command -v ffmpeg >/dev/null; then
            if test -f /etc/apt/sources.list.d/ubuntu.sources; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
            fi
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
          python scripts/build-ui-helper.py
          sudo chmod 666 /dev/kvm
      - name: Verify the full interaction suite on the same APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: python scripts/android-ui-checks.py --apk android/app/build/outputs/apk/release/app-release.apk
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-interaction-evidence
          path: verification/android-v1.2.6/
          retention-days: 30
          if-no-files-found: warn
  themes:
    needs: sound
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [26, 31, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: unverified-candidate-apk
          path: android/app/build/outputs/apk/release
          run-id: 39809400056
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Prepare emulator verification tools
        run: |
          python -m pip install Pillow
          if ! command -v ffmpeg >/dev/null; then
            if test -f /etc/apt/sources.list.d/ubuntu.sources; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
            fi
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
          python scripts/build-ui-helper.py
          sudo chmod 666 /dev/kvm
      - name: Verify real phone modes, palettes, navigation and playback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: python scripts/android-theme-checks.py --apk android/app/build/outputs/apk/release/app-release.apk
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-theme-api${{ matrix.api }}
          path: verification/android-theme-api${{ matrix.api }}/
          retention-days: 30
          if-no-files-found: warn
  publish:
    needs: [provenance, sound, interactions, themes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f9c7d92ab29b7bb9c007ca89723c30a8949c3283
      - uses: actions/download-artifact@v4
        with:
          name: unverified-candidate-apk
          path: android/app/build/outputs/apk/release
          run-id: 39809400056
          github-token: ${{ github.token }}
      - name: Publish only the exact APK after every audited validation passes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=f9c7d92ab29b7bb9c007ca89723c30a8949c3283
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "$source"
          cp android/app/build/outputs/apk/release/app-release.apk Aiplayed-v1.2.6.apk
          sha256sum Aiplayed-v1.2.6.apk > Aiplayed-v1.2.6.apk.sha256
          if gh release view v1.2.6 >/dev/null 2>&1; then
            test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.6 --jq .object.sha)" = "$source"
            gh release upload v1.2.6 Aiplayed-v1.2.6.apk Aiplayed-v1.2.6.apk.sha256 --clobber
          else
            gh release create v1.2.6 Aiplayed-v1.2.6.apk Aiplayed-v1.2.6.apk.sha256 --target "$source" --title "Aiplayed v1.2.6" --notes-file verification/RELEASE_NOTES_1.2.6.md
          fi

