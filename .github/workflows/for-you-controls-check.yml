name: Verify For You controls on retained APK
on:
  push:
    branches: [qa/for-you-scroll]
permissions:
  contents: read
  actions: read
jobs:
  for-you:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unverified-candidate-apk
          run-id: 40214101378
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Verify scroll-boundary regression and compile inspector
        run: |
          python scripts/android-ui-geometry.test.py
          python scripts/android-theme-driver.test.py
          python scripts/build-ui-helper.py
          sudo chmod 666 /dev/kvm
      - name: Verify refresh and playlists across text sizes and rotation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: python scripts/android-ui-checks.py --apk candidate/app-release.apk --scenario recommendations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: for-you-control-evidence
          retention-days: 14
          path: verification/android-v1.3.0/
