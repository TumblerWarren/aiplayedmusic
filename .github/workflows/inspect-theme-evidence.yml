name: Inspect Android theme failure state
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-theme-evidence.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: theme-evidence-api*
          run-id: 39762160393
          github-token: ${{ github.token }}
          path: evidence
      - name: Print failure state and application diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for d in sorted(Path('evidence').iterdir()):
              print('API', d.name, flush=True)
              for p in d.rglob('result.json'): print(p.read_text(), flush=True)
              for p in d.rglob('failure.xml'):
                  for n in ET.parse(p).getroot().iter('node'):
                      if n.get('content-desc') or n.get('text'):
                          print(dict(n.attrib), flush=True)
              for p in d.rglob('media-index.txt'): print(p.name,p.read_text(),flush=True)
              for p in d.rglob('logcat.txt'):
                  lines=p.read_text().splitlines()
                  lines=[l for l in lines if any(k in l for k in ['ReactNativeJS','AndroidRuntime','MusicModule','LocalMusic','FATAL','theme','ThemePreferences'])]
                  print('\n'.join(lines[-100:]),flush=True)
          PY
