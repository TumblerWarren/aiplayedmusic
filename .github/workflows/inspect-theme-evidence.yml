name: Probe Android 8 system theme
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-theme-evidence.yml]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unverified-candidate-apk
          run-id: 39751660475
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Prepare isolated diagnostic APK
        run: |
          python -m pip install --quiet Pillow
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar -o /tmp/apktool.jar
          java -jar /tmp/apktool.jar d -r -f candidate/app-release.apk -o /tmp/patched
          python - <<'PY'
          from pathlib import Path
          import re
          p=next(Path('/tmp/patched').rglob('systemui/singletons/SystemUI.smali'))
          s=p.read_text()
          s,n=re.subn(r'const/4 (v\d+), 0x3',r'const/4 \1, -0x1',s)
          assert n==1, 'Expected one automatic-battery constant'
          p.write_text(s)
          PY
          java -jar /tmp/apktool.jar b /tmp/patched -o /tmp/probe.apk
          keytool -genkeypair -keystore /tmp/probe.keystore -storepass android -keypass android -alias probe -dname CN=Diagnostic -keyalg RSA -validity 1
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f 4 /tmp/probe.apk /tmp/probe-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks /tmp/probe.keystore --ks-pass pass:android --key-pass pass:android /tmp/probe-aligned.apk
          python scripts/build-ui-helper.py
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: python scripts/android-theme-checks.py --apk /tmp/probe-aligned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe26-theme-evidence
          path: verification/android-theme-api26/
