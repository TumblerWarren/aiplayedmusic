name: Probe final Android 12 navigation
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-theme-evidence.yml]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unverified-candidate-apk
          run-id: 39770122788
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Prepare isolated final-path diagnostic
        run: |
          python -m pip install --quiet Pillow
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python scripts/build-ui-helper.py
          sudo chmod 666 /dev/kvm
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/android-theme-checks.py')
          s=p.read_text()
          start=s.index("    for choice in ['System', 'Light', 'Dark']:")
          end=s.index("    tap('Library'); tap('Open now playing'); appearance('dark-player', True)",start)
          s=s[:start]+"    preference('Dark'); tap('Library'); start_fixture(); phone(False)\n"+s[end:]
          p.write_text(s)
          PY
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: python scripts/android-theme-checks.py --apk candidate/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api31-player-return-probe
          path: verification/android-theme-api31/
