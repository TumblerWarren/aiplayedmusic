name: Inspect saved theme evidence
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-theme-evidence.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: theme-evidence-api*
          run-id: 39740576422
          github-token: ${{ github.token }}
          path: evidence
      - run: python -m pip install --quiet Pillow
      - name: Inspect recorded failure state and screenshot colours
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET
          from PIL import Image
          for directory in sorted(Path('evidence').iterdir()):
              print('\nAPI EVIDENCE:', directory.name, flush=True)
              for p in directory.rglob('result.json'):
                  print(p.name, p.read_text(), flush=True)
              for p in directory.rglob('phone-request-*.txt'):
                  print(p.name, p.read_text(), flush=True)
              for name in ['fresh-install-follows-dark-phone', 'failure', 'system-startup-phone-light']:
                  for p in directory.rglob(name + '.xml'):
                      root=ET.parse(p).getroot()
                      print('UI:',p.name,flush=True)
                      for n in root.iter('node'):
                          label=n.get('content-desc') or n.get('text','')
                          if label:
                              print({key:n.get(key) for key in ['package','text','content-desc','selected','clickable','bounds']},flush=True)
                  for p in directory.rglob(name + '.png'):
                      with Image.open(p) as image:
                          image=image.convert('RGB')
                          colours=sorted(image.getcolors(image.width*image.height),reverse=True)
                          print('IMAGE:',p.name,image.size,'DOMINANT:',colours[:12],flush=True)
                          for colour in [(23,25,30),(255,251,246)]:
                              print('EXPECTED:',colour,'PIXELS:',sum(count for count,c in colours if c==colour),flush=True)
          PY
