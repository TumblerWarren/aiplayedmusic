name: Inspect saved theme evidence
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-theme-evidence.yml]
permissions:
  contents: read
  actions: read
jobs:
  probe26:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unverified-candidate-apk
          run-id: 39740576422
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
      - run: |
          python -m pip install --quiet Pillow
          sudo chmod 666 /dev/kvm
          cat > /tmp/probe-theme.sh <<'SH'
          set -eu
          adb install -r candidate/app-release.apk
          adb shell pm grant app.localmusic.player android.permission.READ_EXTERNAL_STORAGE
          adb shell cmd uimode night yes
          echo 'BEFORE LAUNCH GLOBAL CONFIGURATION'
          adb shell am get-config
          adb shell dumpsys uimode
          activity=$(adb shell cmd package resolve-activity --brief app.localmusic.player | tail -1 | tr -d '\r')
          adb shell am start -n "$activity"
          sleep 8
          echo 'AFTER LAUNCH GLOBAL CONFIGURATION'
          adb shell am get-config
          adb shell dumpsys uimode
          adb shell dumpsys activity activities | grep -Ei 'configuration|overrideconfig|night|app.localmusic' || true
          adb exec-out screencap -p > /tmp/api26-probe.png
          python -c "from PIL import Image; i=Image.open('/tmp/api26-probe.png').convert('RGB'); print('IMAGE COLOURS',sorted(i.getcolors(i.width*i.height),reverse=True)[:8])"
          SH
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: bash /tmp/probe-theme.sh
