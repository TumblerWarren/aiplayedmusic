name: Pull request checks
on:
  pull_request:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Pull request checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify application behaviour
        run: npm run check
      - name: Verify listening habits and migration
        run: python scripts/recommendations/check_habits.py
      - name: Verify Android UI and theme drivers
        run: |
          python scripts/android-ui-geometry.test.py
          python scripts/android-ui-startup.test.py
          python scripts/android-theme-driver.test.py
