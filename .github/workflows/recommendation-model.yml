name: Validate recommendation model
on:
  push:
    branches: [feat/offline-personal-mixes]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: recommendation-model-${{ github.ref }}
  cancel-in-progress: false
jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[model gate]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MedAliAdlouni/ssondo
          ref: 231d260cc1be2eb93b060accc8bfa218feff3a74
          path: .model-tools/ssondo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/recommendations/export-requirements.txt
      - name: Install CPU export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.14.1+cpu' 'torchvision==0.29.1+cpu' 'torchaudio==2.11.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/recommendations/export-requirements.txt
          python -m pip check
      - name: Export headless FP32 model and validate held-out music
        run: python scripts/recommendations/export_model.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recommendation-model-gate
          path: .model-tools/output/
          include-hidden-files: true
          retention-days: 30

  android-parity:
    if: always() && (needs.export.result == 'success' || contains(github.event.head_commit.message, '[android gate]') || contains(github.event.head_commit.message, '[publish model]'))
    env:
      MODEL_GATE_RUN_ID: '39904828659'
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: recommendation-model-gate
          path: scripts/recommendations/android-gate/src/main/assets
          run-id: ${{ needs.export.result == 'success' && github.run_id || env.MODEL_GATE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify native transform against independent FFT oracle
        run: |
          python -m pip install 'numpy==2.4.6'
          python scripts/recommendations/test_preprocessing.py
      - name: Build independent CPU model harness
        run: |
          gradle -p scripts/recommendations/android-gate assembleDebug --no-daemon
          sudo chmod 666 /dev/kvm
      - name: Compare Android Interpreter and native log-mel with Python
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096
          script: python scripts/recommendations/check_android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recommendation-android-parity
          path: verification/recommendations/
          retention-days: 30

  publish-model:
    needs: android-parity
    if: always() && ((needs.android-parity.result == 'success' && contains(github.event.head_commit.message, '[publish model]')) || contains(github.event.head_commit.message, '[publish approved model]'))
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: recommendation-model-gate
          path: .model-tools/output
          run-id: 39904828659
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: recommendation-android-parity
          path: .model-tools/android
          run-id: ${{ needs.android-parity.result == 'success' && github.run_id || '39906078529' }}
          github-token: ${{ github.token }}
      - name: Package approved production model assets
        run: python scripts/recommendations/package_model.py
      - name: Publish immutable model-assets release without changing latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = 'd03acdb41926d2c82e300c32bdda3c4b1d2a35c6'
          if gh release view model-assets-ssondo-fp32-v1 >/dev/null 2>&1; then
            echo 'Existing model release is immutable; refusing to replace assets.'
            exit 1
          fi
          gh release create model-assets-ssondo-fp32-v1 .model-tools/ssondo-fp32-v1.zip .model-tools/SHA256SUMS .model-tools/output/python-parity.json .model-tools/android/android-parity.json .model-tools/output/environment.txt --target d03acdb41926d2c82e300c32bdda3c4b1d2a35c6 --title 'Model assets: S-SONDO MobileNetV3 FP32 v1' --notes-file .model-tools/model-release-notes.md --latest=false --prerelease
