name: Validate recommendation model
on:
  push:
    branches: [feat/offline-personal-mixes]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recommendation-model-${{ github.ref }}
  cancel-in-progress: false
jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[model gate]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MedAliAdlouni/ssondo
          ref: 231d260cc1be2eb93b060accc8bfa218feff3a74
          path: .model-tools/ssondo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.4,<2.15' torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'litert-torch==0.10.0' 'ai-edge-litert==2.3.0' 'einops==0.8.1' 'timm==1.0.22' 'huggingface-hub>=0.20'
          python -m pip check
      - name: Export headless FP32 model and validate held-out music
        run: python scripts/recommendations/export_model.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recommendation-model-gate
          path: .model-tools/output/
          include-hidden-files: true
          retention-days: 30
