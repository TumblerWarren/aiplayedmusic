name: Validate recommendation model
on:
  push:
    branches: [feat/offline-personal-mixes]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recommendation-model-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[model gate]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect pinned model and converter dependencies
        run: |
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          result = {}
          for package, version in [('litert-torch', '0.10.0'), ('ai-edge-litert', '2.3.0'), ('ssondo', '0.3.1')]:
              url = f'https://pypi.org/pypi/{package}/{version}/json'
              with urllib.request.urlopen(url, timeout=60) as response:
                  data = json.load(response)
              result[package] = {'version': data['info']['version'], 'requires': data['info']['requires_dist']}
          with urllib.request.urlopen('https://huggingface.co/api/models/mohammedali2501/ssondo?blobs=true', timeout=60) as response:
              model = json.load(response)
          result['model'] = {'revision': model['sha'], 'checkpoint': next(item for item in model['siblings'] if item['rfilename'] == 'matpac_mobilenetv3.ckpt')}
          result['source_revision'] = '231d260cc1be2eb93b060accc8bfa218feff3a74'
          Path('model-probe.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recommendation-model-probe
          path: model-probe.json
          retention-days: 30
