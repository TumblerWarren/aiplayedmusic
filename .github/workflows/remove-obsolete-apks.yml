name: Remove obsolete APKs and keep v1.2.5 plus build 71
on:
  push:
    branches: [ci/verify-android12-only-20261022]
permissions:
  contents: write
  actions: write
jobs:
  cleanup-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete only inventoried obsolete APK assets and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          targets = json.loads(r'''{"assets":[{"id":661816006,"name":"Aiplayed-v1.2.4.apk","tag":"v1.2.4","keep":false},{"id":661816005,"name":"Aiplayed-v1.2.4.apk.sha256","tag":"v1.2.4","keep":false}],"artifacts":[{"id":12434211945,"name":"aiplayedmusic-apk","run":39791701435,"keep":false,"expired":false},{"id":12431559938,"name":"unverified-candidate-apk","run":39791701435,"keep":false,"expired":false},{"id":12428497558,"name":"unverified-candidate-apk","run":39783516772,"keep":false,"expired":false},{"id":12427330347,"name":"unverified-candidate-apk","run":39778544244,"keep":false,"expired":false},{"id":12424245618,"name":"aiplayedmusic-apk","run":39770122788,"keep":false,"expired":false},{"id":12422812085,"name":"unverified-candidate-apk","run":39770122788,"keep":false,"expired":false},{"id":12420353621,"name":"aiplayedmusic-apk","run":39762160393,"keep":false,"expired":false},{"id":12418954383,"name":"unverified-candidate-apk","run":39762160393,"keep":false,"expired":false},{"id":12418640502,"name":"unverified-candidate-apk","run":39758954751,"keep":false,"expired":false},{"id":12415989353,"name":"aiplayedmusic-apk","run":39751660475,"keep":false,"expired":false},{"id":12415390342,"name":"unverified-candidate-apk","run":39751660475,"keep":false,"expired":false},{"id":12411207108,"name":"aiplayedmusic-apk","run":39740576422,"keep":false,"expired":false},{"id":12409613175,"name":"unverified-candidate-apk","run":39740576422,"keep":false,"expired":false},{"id":12407885384,"name":"unverified-candidate-apk","run":39735488192,"keep":false,"expired":false},{"id":12398331557,"name":"unverified-candidate-apk","run":39712593924,"keep":false,"expired":false},{"id":12356829207,"name":"unverified-candidate-apk","run":39625723632,"keep":false,"expired":false},{"id":12349138316,"name":"aiplayedmusic-apk","run":39605146635,"keep":false,"expired":false},{"id":12348299289,"name":"unverified-candidate-apk","run":39605146635,"keep":false,"expired":false}]}''')
          keep_assets = {662208830, 662208831}
          keep_runs = {39583253474, 39809400056}
          def api(path, method='GET'):
              result = subprocess.run(['gh', 'api', '--method', method, path], check=True, capture_output=True, text=True)
              return json.loads(result.stdout) if result.stdout.strip() else None
          keep = api(f'repos/{repo}/releases/419451400')
          assert keep['tag_name'] == 'v1.2.5'
          assert keep_assets.issubset({asset['id'] for asset in keep['assets']})
          assert next(asset for asset in keep['assets'] if asset['id'] == 662208830)['digest'] == 'sha256:97a1d5ebcf65f6e70acde05c3c6be932bac41f5037811bb992b97cfdb3da04e4'
          obsolete_release = api(f'repos/{repo}/releases/419306657')
          assert obsolete_release['tag_name'] == 'v1.2.4'
          obsolete_assets = {asset['id']: asset for asset in obsolete_release['assets']}
          for target in targets['assets']:
              assert target['id'] not in keep_assets and target['tag'] == 'v1.2.4'
              assert obsolete_assets[target['id']]['name'] == target['name']
          for target in targets['artifacts']:
              assert target['run'] not in keep_runs
              actual = api(f"repos/{repo}/actions/artifacts/{target['id']}")
              assert actual['name'] == target['name'] and 'apk' in actual['name'].lower()
              assert actual['workflow_run']['id'] == target['run'] and actual['workflow_run']['id'] not in keep_runs
          print(f"Validated deletion plan: {len(targets['assets'])} obsolete release files and {len(targets['artifacts'])} APK artifacts.", flush=True)
          for target in targets['assets']:
              api(f"repos/{repo}/releases/assets/{target['id']}", 'DELETE')
              print('DELETED release asset', target['id'], target['name'], flush=True)
          for target in targets['artifacts']:
              api(f"repos/{repo}/actions/artifacts/{target['id']}", 'DELETE')
              print('DELETED APK artifact', target['id'], target['name'], 'run', target['run'], flush=True)
          preserved = api(f'repos/{repo}/releases/419451400')
          assert keep_assets.issubset({asset['id'] for asset in preserved['assets']})
          remaining = []
          for page in range(1, 101):
              batch = api(f'repos/{repo}/actions/artifacts?per_page=100&page={page}')['artifacts']
              remaining.extend(batch)
              if len(batch) < 100:
                  break
          else:
              raise AssertionError('Verification pagination limit reached')
          obsolete_remaining = [artifact for artifact in remaining if 'apk' in artifact['name'].lower() and artifact.get('workflow_run', {}).get('id') not in keep_runs]
          assert not obsolete_remaining, [(artifact['id'], artifact['name']) for artifact in obsolete_remaining]
          legacy = api(f'repos/{repo}/releases/419306657')
          assert not any(asset['name'].lower().endswith(('.apk', '.apk.sha256')) for asset in legacy['assets'])
          print('VERIFIED: v1.2.5 APK/checksum preserved; only stable/new-build APK artifacts remain; run 71 untouched.', flush=True)
          PY
