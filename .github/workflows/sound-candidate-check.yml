name: Focused Sound candidate verification
on:
  push:
    branches: [fix/sound-dial-scroll-search]
    paths:
      - '.github/workflows/sound-candidate-check.yml'
      - 'scripts/check-sound-candidate.py'
      - 'scripts/android-ui-checks.py'
permissions:
  contents: read
  actions: read
jobs:
  sound:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        rotation: [0, 1]
    env:
      ROTATION: ${{ matrix.rotation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: actions/download-artifact@v4
        with:
          name: unverified-candidate-apk
          run-id: 42084020487
          github-token: ${{ github.token }}
          path: candidate
      - run: python scripts/build-ui-helper.py
      - name: Prepare emulator tools
        run: |
          command -v ffmpeg
          sudo chmod 666 /dev/kvm
      - name: Verify existing APK Sound interactions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: python scripts/check-sound-candidate.py
      - name: Upload Sound evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sound-candidate-rotation-${{ matrix.rotation }}
          path: verification/
          retention-days: 7
          if-no-files-found: warn
