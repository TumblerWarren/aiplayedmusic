name: Clean up first stable release
on:
  push:
    branches: [main]
    paths: [.github/workflows/stable-cleanup.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: stable-release-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[stable cleanup]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const stable = (await github.rest.repos.getReleaseByTag({...repo, tag: 'v1.2.4'})).data;
            const apk = stable.assets.find(a => a.name === 'Aiplayed-v1.2.4.apk');
            if (stable.draft || stable.prerelease || !apk || apk.digest !== 'sha256:d9a70f80a363d07ed5e903f934b9c970a92e69f23d8f896d851d7266d7ff7bca')
              throw new Error('Verified stable APK guard failed');
            const releases = await github.paginate(github.rest.repos.listReleases, {...repo, per_page: 100});
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...repo, per_page: 100});
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {...repo, per_page: 100});
            const keepArtifacts = new Set([12330253043, 12329738558]);
            let releaseBytes = 0, artifactBytes = 0, cacheBytes = 0, deletedArtifacts = 0;
            for (const release of releases) {
              if (release.id !== 419207160) continue;
              releaseBytes += release.assets.reduce((n, a) => n + a.size, 0);
              await github.rest.repos.deleteRelease({...repo, release_id: release.id});
              core.info('Removed obsolete release ' + release.tag_name + '; source tag preserved');
            }
            for (const artifact of artifacts) {
              if (keepArtifacts.has(artifact.id)) continue;
              if (artifact.created_at > '2026-10-21T08:16:00Z') continue;
              await github.rest.actions.deleteArtifact({...repo, artifact_id: artifact.id});
              artifactBytes += artifact.size_in_bytes;
              deletedArtifacts++;
            }
            for (const cache of caches) {
              await github.rest.actions.deleteActionsCacheById({...repo, cache_id: cache.id});
              cacheBytes += cache.size_in_bytes;
            }
            await github.rest.repos.updateRelease({
              ...repo, release_id: stable.id, name: 'Aiplayed v1.2.4 — First stable release',
              body: 'First stable release of Aiplayed.\n\n' + stable.body.replace(/^First stable release of Aiplayed\.\n\n/, ''),
              make_latest: 'true'
            });
            const after = (await github.rest.repos.getReleaseByTag({...repo, tag: 'v1.2.4'})).data;
            if (!after.assets.some(a => a.id === apk.id && a.digest === apk.digest))
              throw new Error('Stable asset changed unexpectedly');
            await core.summary.addHeading('First stable release cleanup')
              .addRaw(JSON.stringify({stable: after.tag_name, removedOldReleaseBytes: releaseBytes, removedArtifacts: deletedArtifacts, removedArtifactBytes: artifactBytes, removedCacheBytes: cacheBytes, keptEvidence: [...keepArtifacts]}, null, 2))
              .write();
            core.info(JSON.stringify({releaseBytes, deletedArtifacts, artifactBytes, cacheBytes}));
