name: Check candidate APK themes
on:
  workflow_call:
    inputs:
      candidate_run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Build run on this exact commit containing unverified-candidate-apk
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  theme:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [26, 31, 35]
    steps:
      - uses: actions/checkout@v4
      - name: Verify theme-driver regressions
        run: |
          python scripts/android-ui-geometry.test.py
          python scripts/android-theme-driver.test.py
      - name: Require a candidate from this exact source revision
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq .head_sha)" = "$GITHUB_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: unverified-candidate-apk
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Install verification tools and prepare inspector
        run: |
          python -m pip install Pillow
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python scripts/build-ui-helper.py
          sudo chmod 666 /dev/kvm
      - name: Verify theme preferences, startup, views and playback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: python scripts/android-theme-checks.py --apk candidate/app-release.apk
      - name: Retain screenshots, startup videos and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-evidence-api${{ matrix.api }}-attempt${{ github.run_attempt }}
          path: verification/android-theme-api${{ matrix.api }}/
          retention-days: 30
          if-no-files-found: warn
