plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'app.localmusic.player'
version = '1.0.0'
android {
  namespace 'app.localmusic.engine'
  defaultConfig {
    minSdkVersion 26
    versionCode 1
    versionName '1.0.0'
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.1'
  implementation 'androidx.work:work-runtime:2.11.0'
  implementation project(':aiplayed-recommendation-runtime')
  implementation 'androidx.media3:media3-exoplayer:1.11.1'
}

// Every build path (Expo run, EAS, Gradle or CI) bundles the same verified artifact.
// This runs on the build host; the Android application never downloads a model.
def bundleRecommendationModel = tasks.register('bundleRecommendationModel', Exec) {
  workingDir new File(projectDir, '../../..')
  commandLine 'python3', 'scripts/recommendations/fetch_model.py'
}
tasks.named('preBuild').configure { dependsOn bundleRecommendationModel }
